<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.45" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="#334155" stroke-width="4"/>
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="#e11d48" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Subtle Card Suit Watermarks -->
  <g fill="#334155" opacity="0.18">
    <!-- Spade -->
    <path d="M100 120 C100 80, 70 60, 60 50 C50 60, 20 80, 20 120 C20 140, 45 150, 56 142 L52 160 L68 160 L64 142 C75 150, 100 140, 100 120 Z" transform="scale(0.8) translate(40, 60)" />
    <!-- Heart -->
    <path d="M60 40 C60 15, 20 15, 20 55 C20 85, 60 115, 60 115 C60 115, 100 85, 100 55 C100 15, 60 15, 60 40 Z" transform="scale(0.8) translate(460, 60)" fill="#e11d48" opacity="0.3"/>
    <!-- Diamond -->
    <path d="M60 20 L95 60 L60 100 L25 60 Z" transform="scale(0.8) translate(40, 450)" fill="#e11d48" opacity="0.3"/>
    <!-- Club -->
    <circle cx="60" cy="40" r="18" transform="scale(0.8) translate(460, 440)" />
    <circle cx="44" cy="65" r="18" transform="scale(0.8) translate(460, 440)" />
    <circle cx="76" cy="65" r="18" transform="scale(0.8) translate(460, 440)" />
    <path d="M56 68 L50 90 L70 90 L64 68 Z" transform="scale(0.8) translate(460, 440)" />
  </g>

  <!-- Crown on Top of Strawberry -->
  <g filter="url(#goldGlow)" transform="translate(196, 80)">
    <path d="M10 50 L20 20 L50 35 L60 10 L70 35 L100 20 L110 50 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
    <circle cx="20" cy="18" r="4" fill="#fef08a"/>
    <circle cx="60" cy="8" r="5" fill="#fef08a"/>
    <circle cx="100" cy="18" r="4" fill="#fef08a"/>
  </g>

  <!-- Strawberry Body -->
  <g filter="url(#crimsonGlow)">
    <path d="M 256 420 
             C 170 390, 130 310, 136 230 
             C 140 180, 185 155, 256 168 
             C 327 155, 372 180, 376 230 
             C 382 310, 342 390, 256 420 Z" 
          fill="url(#berryGrad)" 
          stroke="#fda4af" 
          stroke-width="3"/>
  </g>

  <!-- Green Crown Leaves -->
  <path d="M256 170 C240 120, 180 125, 170 145 C190 155, 215 160, 240 172 Z" fill="url(#leafGrad)"/>
  <path d="M256 170 C272 120, 332 125, 342 145 C322 155, 297 160, 272 172 Z" fill="url(#leafGrad)"/>
  <path d="M256 170 C245 110, 255 95, 256 90 C257 95, 267 110, 256 170 Z" fill="#22c55e"/>
  <path d="M256 175 C210 165, 150 185, 140 205 C170 200, 210 190, 256 175 Z" fill="url(#leafGrad)"/>
  <path d="M256 175 C302 165, 362 185, 372 205 C342 200, 302 190, 256 175 Z" fill="url(#leafGrad)"/>
  <circle cx="256" cy="172" r="10" fill="#15803d"/>

  <!-- Golden Strawberry Seeds -->
  <g fill="#fef08a" opacity="0.9">
    <ellipse cx="210" cy="210" rx="4" ry="7" transform="rotate(-15 210 210)"/>
    <ellipse cx="256" cy="215" rx="4" ry="7"/>
    <ellipse cx="302" cy="210" rx="4" ry="7" transform="rotate(15 302 210)"/>

    <ellipse cx="180" cy="260" rx="4" ry="7" transform="rotate(-25 180 260)"/>
    <ellipse cx="230" cy="265" rx="4" ry="7" transform="rotate(-10 230 265)"/>
    <ellipse cx="282" cy="265" rx="4" ry="7" transform="rotate(10 282 265)"/>
    <ellipse cx="332" cy="260" rx="4" ry="7" transform="rotate(25 332 260)"/>

    <ellipse cx="205" cy="315" rx="4" ry="7" transform="rotate(-20 205 315)"/>
    <ellipse cx="256" cy="320" rx="4" ry="7"/>
    <ellipse cx="307" cy="315" rx="4" ry="7" transform="rotate(20 307 315)"/>

    <ellipse cx="235" cy="365" rx="4" ry="7" transform="rotate(-15 235 365)"/>
    <ellipse cx="277" cy="365" rx="4" ry="7" transform="rotate(15 277 365)"/>

    <ellipse cx="256" cy="395" rx="3.5" ry="6"/>
  </g>

  <!-- Tarneeb Card Ribbon / Text Accent -->
  <rect x="96" y="440" width="320" height="34" rx="17" fill="#0f172a" stroke="#e11d48" stroke-width="2"/>
  <text x="256" y="463" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="3" text-anchor="middle">TARNEEB SCOREBOARD</text>
</svg>
