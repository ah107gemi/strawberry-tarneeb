<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Solid Dark Navy Background with subtle center depth -->
    <radialGradient id="navyDepth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#243048" />
      <stop offset="55%" stop-color="#182032" />
      <stop offset="85%" stop-color="#182032" />
      <stop offset="100%" stop-color="#182032" />
    </radialGradient>

    <!-- Deep Crimson & Ruby Aura -->
    <radialGradient id="crimsonAura" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#e11d48" stop-opacity="0.22" />
      <stop offset="75%" stop-color="#e11d48" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#182032" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Strawberry Berry Gradient -->
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="20%" stop-color="#f43f5e" />
      <stop offset="60%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Leaves Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Shadow filters -->
    <filter id="royalShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#e11d48" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="goldGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- 1. Edge-to-edge solid dark navy background (100% opaque, no transparent corners) -->
  <rect width="512" height="512" fill="#182032"/>
  <rect width="512" height="512" fill="url(#navyDepth)"/>

  <!-- Subtle Radial Aura behind Strawberry -->
  <circle cx="256" cy="256" r="215" fill="url(#crimsonAura)"/>

  <!-- Subtle Card Suit Watermarks within Safe Zone -->
  <g fill="#94a3b8" opacity="0.14">
    <!-- Spade (top-left) -->
    <g transform="translate(100, 105) scale(0.9)">
      <path d="M25 5 C25 22, 5 32, 5 50 C5 60, 16 68, 22 64 L18 75 L32 75 L28 64 C34 68, 45 60, 45 50 C45 32, 25 22, 25 5 Z" />
    </g>
    <!-- Heart (top-right) -->
    <g transform="translate(365, 105) scale(0.9)" fill="#e11d48" opacity="0.35">
      <path d="M25 15 C25 5, 5 5, 5 25 C5 42, 25 60, 25 60 C25 60, 45 42, 45 25 C45 5, 25 5, 25 15 Z" />
    </g>
    <!-- Diamond (bottom-left) -->
    <g transform="translate(100, 360) scale(0.9)" fill="#e11d48" opacity="0.35">
      <path d="M25 5 L45 35 L25 65 L5 35 Z" />
    </g>
    <!-- Club (bottom-right) -->
    <g transform="translate(365, 360) scale(0.9)">
      <circle cx="25" cy="20" r="10" />
      <circle cx="15" cy="35" r="10" />
      <circle cx="35" cy="35" r="10" />
      <path d="M22 35 L19 55 L31 55 L28 35 Z" />
    </g>
  </g>

  <!-- 2. The Crowned Royal Strawberry Emblem (Scaled to 77% height = 392px, safe inner padding) -->
  <g filter="url(#royalShadow)" transform="translate(256, 254) scale(1.10) translate(-256, -248)">
    <!-- Gold Crown -->
    <g filter="url(#goldGlow)" transform="translate(196, 70)">
      <path d="M10 52 L20 18 L50 34 L60 8 L70 34 L100 18 L110 52 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2.5"/>
      <circle cx="20" cy="16" r="5.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
      <circle cx="60" cy="6" r="6.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
      <circle cx="100" cy="16" r="5.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
    </g>

    <!-- Strawberry Body -->
    <path d="M 256 420 
             C 170 390, 130 310, 136 230 
             C 140 180, 185 155, 256 168 
             C 327 155, 372 180, 376 230 
             C 382 310, 342 390, 256 420 Z" 
          fill="url(#berryGrad)" 
          stroke="#fda4af" 
          stroke-width="3.5"/>

    <!-- Green Leaves Crown -->
    <path d="M256 170 C240 118, 178 122, 168 144 C188 154, 214 160, 240 172 Z" fill="url(#leafGrad)"/>
    <path d="M256 170 C272 118, 334 122, 344 144 C324 154, 298 160, 272 172 Z" fill="url(#leafGrad)"/>
    <path d="M256 170 C245 102, 255 88, 256 82 C257 88, 267 102, 256 170 Z" fill="#22c55e"/>
    <path d="M256 175 C208 164, 148 184, 138 204 C168 199, 208 189, 256 175 Z" fill="url(#leafGrad)"/>
    <path d="M256 175 C304 164, 364 184, 374 204 C344 199, 304 189, 256 175 Z" fill="url(#leafGrad)"/>
    <circle cx="256" cy="172" r="11" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>

    <!-- Golden Seeds -->
    <g fill="#fef08a" opacity="0.95" stroke="#ca8a04" stroke-width="0.75">
      <ellipse cx="210" cy="210" rx="4.5" ry="8" transform="rotate(-15 210 210)"/>
      <ellipse cx="256" cy="215" rx="4.5" ry="8"/>
      <ellipse cx="302" cy="210" rx="4.5" ry="8" transform="rotate(15 302 210)"/>

      <ellipse cx="180" cy="260" rx="4.5" ry="8" transform="rotate(-25 180 260)"/>
      <ellipse cx="230" cy="265" rx="4.5" ry="8" transform="rotate(-10 230 265)"/>
      <ellipse cx="282" cy="265" rx="4.5" ry="8" transform="rotate(10 282 265)"/>
      <ellipse cx="332" cy="260" rx="4.5" ry="8" transform="rotate(25 332 260)"/>

      <ellipse cx="205" cy="315" rx="4.5" ry="8" transform="rotate(-20 205 315)"/>
      <ellipse cx="256" cy="320" rx="4.5" ry="8"/>
      <ellipse cx="307" cy="315" rx="4.5" ry="8" transform="rotate(20 307 315)"/>

      <ellipse cx="235" cy="365" rx="4.5" ry="8" transform="rotate(-15 235 365)"/>
      <ellipse cx="277" cy="365" rx="4.5" ry="8" transform="rotate(15 277 365)"/>

      <ellipse cx="256" cy="395" rx="4" ry="7"/>
    </g>
  </g>
</svg>